# Página pública de status da Autaia (D446, Upptime). Vai na raiz do repositório PÚBLICO "autaia-status", criado a
# partir do modelo upptime/upptime. Só dados de disponibilidade: nada de código nem de cliente.
# Etapa 1: Site, Painel e API. Etapa 2 (com o Núcleo): envio pelo WhatsApp, por um /health/whatsapp agregado.
owner: romariogomesoficial
repo: autaia-status

sites:
  - name: Site
    url: https://autaia.com.br/
  - name: Painel
    url: https://app.autaia.com.br/app/
  - name: API e webhooks
    url: https://api.autaia.com.br/health

status-website:
  baseUrl: /autaia-status
  # Volta para "cname: status.autaia.com.br" (e tira o baseUrl) quando o CNAME status estiver no DNS da Hostinger.
  name: Status da Autaia
  introTitle: "Status da Autaia"
  introMessage: "Se o site, o painel e a API da Autaia estão funcionando agora, e o histórico dos últimos 90 dias."
  navbar:
    - title: Site da Autaia
      href: https://autaia.com.br/
    - title: Ajuda
      href: https://autaia.com.br/ajuda

i18n:
  up: No ar
  down: Fora do ar
  degraded: Lento
  allSystemsOperational: Tudo funcionando
  someSystemsDown: Algo está fora do ar
  activeIncidents: Incidentes em andamento
  pastIncidents: Incidentes anteriores
  liveStatus: Agora
  overallUptime: "Disponibilidade: $UPTIME"
  averageResponseTime: "Tempo médio de resposta: $TIME ms"
  duration: Período
  incidents: Incidentes
  footer: "Página de status da Autaia, atualizada a cada 5 minutos."

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
